/* ============================================================
   0. DETERMINISM
   ============================================================ */
const SEED = 20260413;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(SEED);
const rand=(a=0,b=1)=>a+(b-a)*rng();
const randi=(a,b)=>Math.floor(rand(a,b+1));

const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const ease=(x)=>x*x*(3-2*x);
function kf(t, keys){ // [[time,value],...] smooth-eased
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){
    const a=keys[i], b=keys[i+1];
    if(t<=b[0]){const u=ease(clamp((t-a[0])/(b[0]-a[0]||1),0,1));return lerp(a[1],b[1],u);}
  }
  return keys[keys.length-1][1];
}
function kfv(t, keys, out){ // [[time, [x,y,z]],...]
  out=out||new THREE.Vector3();
  if(t<=keys[0][0]){out.set(...keys[0][1]);return out;}
  for(let i=0;i<keys.length-1;i++){
    const a=keys[i], b=keys[i+1];
    if(t<=b[0]){
      const u=ease(clamp((t-a[0])/(b[0]-a[0]||1),0,1));
      out.set(lerp(a[1][0],b[1][0],u),lerp(a[1][1],b[1][1],u),lerp(a[1][2],b[1][2],u));
      return out;
    }
  }
  out.set(...keys[keys.length-1][1]);return out;
}
const hash1=(x)=>{const s=Math.sin(x*127.1+SEED*0.0001)*43758.5453;return s-Math.floor(s);};

/* ============================================================
   3. PROCEDURAL TEXTURES
   ============================================================ */
function vnoise(px){ // tileable value noise factory, period px cells in x
  const P=px;
  const h=(i,j)=>{const ii=((i%P)+P)%P;const s=Math.sin(ii*127.1+j*311.7+SEED*0.013)*43758.5453;return s-Math.floor(s);};
  return (x,y)=>{
    const xi=Math.floor(x), yi=Math.floor(y);
    const xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);
    return lerp(lerp(a,b,u),lerp(c,d,u),v);
  };
}
function fbmFactory(baseCells,oct){
  const layers=[];
  for(let o=0;o<oct;o++) layers.push(vnoise(baseCells*Math.pow(2,o)));
  return (u,v)=>{
    let s=0,amp=0.5,tot=0;
    for(let o=0;o<oct;o++){
      const c=baseCells*Math.pow(2,o);
      s+=layers[o](u*c,v*c)*amp; tot+=amp; amp*=0.5;
    }
    return s/tot;
  };
}

function makeEarthTextures(){
  const W=640,H=320;
  const cDay=document.createElement('canvas');cDay.width=W;cDay.height=H;
  const gd=cDay.getContext('2d');
  const img=gd.createImageData(W,H);
  const cLit=document.createElement('canvas');cLit.width=W;cLit.height=H;
  const gl2=cLit.getContext('2d');gl2.fillStyle='#000';gl2.fillRect(0,0,W,H);

  const cont=fbmFactory(4,5);
  const detail=fbmFactory(16,3);
  for(let y=0;y<H;y++){
    const v=y/H;
    const lat=(v-0.5)*2;
    for(let x=0;x<W;x++){
      const u=x/W;
      let n=cont(u,v);
      n+=0.12*(detail(u,v)-0.5);
      n-=0.22*Math.pow(Math.abs(lat),2.0);
      const i=(y*W+x)*4;
      let r,g,b;
      const land=n-0.50;
      if(land>0){
        const h2=clamp(land*3.2,0,1);
        const dry=detail(u*2.0,v*1.7+3.1);
        r=lerp(46,118,h2)+dry*46;
        g=lerp(78,102,h2)+dry*24;
        b=lerp(40,74,h2)+dry*18;
        if(h2>0.62){const s=(h2-0.62)/0.38;r=lerp(r,224,s);g=lerp(g,224,s);b=lerp(b,228,s);}
        // city lights on low land
        if(h2<0.4 && detail(u*5.0,v*5.0+9.0)>0.70){
          const bright=Math.floor(90+120*detail(u*9.0,v*9.0));
          gl2.fillStyle='rgba('+bright+','+Math.floor(bright*0.75)+','+Math.floor(bright*0.42)+',1)';
          gl2.fillRect(x,y,1,1);
        }
      } else {
        const dp=clamp(-land*3.4,0,1);
        r=lerp(24,4,dp); g=lerp(58,20,dp); b=lerp(96,58,dp);
      }
      const ice=smoothstep(0.80,0.94,Math.abs(lat));
      r=lerp(r,232,ice);g=lerp(g,238,ice);b=lerp(b,244,ice);
      img.data[i]=r|0;img.data[i+1]=g|0;img.data[i+2]=b|0;img.data[i+3]=255;
    }
  }
  gd.putImageData(img,0,0);

  const CW=512,CH=256;
  const cCl=document.createElement('canvas');cCl.width=CW;cCl.height=CH;
  const gc=cCl.getContext('2d');
  const ci=gc.createImageData(CW,CH);
  const cl=fbmFactory(3,4), band=fbmFactory(2,2);
  for(let y=0;y<CH;y++){
    const v=y/CH, lat=(v-0.5)*2;
    const bandMul=0.55+0.45*Math.cos(lat*Math.PI*3.1);
    for(let x=0;x<CW;x++){
      const u=x/CW;
      let n=cl(u,v*0.55+0.2);
      n=n*0.75+0.25*band(u,v*1.3);
      let a=smoothstep(0.50,0.78,n*bandMul+0.10);
      a*=1.0-smoothstep(0.86,1.0,Math.abs(lat));
      const i=(y*CW+x)*4;
      ci.data[i]=255;ci.data[i+1]=255;ci.data[i+2]=255;ci.data[i+3]=(a*255)|0;
    }
  }
  gc.putImageData(ci,0,0);
  return {day:cDay,lights:cLit,clouds:cCl};
}

function makeHullTexture(base,dark,scorch){
  const S=256;
  const c=document.createElement('canvas');c.width=S;c.height=S;
  const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,S,S);
  // panel plates
  for(let i=0;i<26;i++){
    const w=randi(24,80),h=randi(20,72),x=randi(0,S-w),y=randi(0,S-h);
    g.fillStyle='rgba(255,255,255,'+(0.02+rand()*0.07).toFixed(3)+')';
    g.fillRect(x,y,w,h);
    g.strokeStyle=dark;g.lineWidth=1;g.strokeRect(x+0.5,y+0.5,w,h);
  }
  // seams
  g.strokeStyle=dark;g.lineWidth=1.5;
  for(let i=0;i<10;i++){
    g.beginPath();
    if(rng()>0.5){const y=randi(0,S);g.moveTo(0,y);g.lineTo(S,y);}
    else {const x=randi(0,S);g.moveTo(x,0);g.lineTo(x,S);}
    g.stroke();
  }
  // rivets
  for(let i=0;i<160;i++){
    g.fillStyle='rgba(0,0,0,0.28)';
    g.beginPath();g.arc(rand(0,S),rand(0,S),rand(0.6,1.4),0,6.283);g.fill();
  }
  // grime
  for(let i=0;i<70;i++){
    g.fillStyle='rgba(0,0,0,'+(0.03+rand()*0.09).toFixed(3)+')';
    g.beginPath();g.ellipse(rand(0,S),rand(0,S),rand(3,26),rand(2,12),rand(0,3.14),0,6.283);g.fill();
  }
  if(scorch){
    for(let i=0;i<9;i++){
      const x=rand(0,S),y=rand(0,S),r=rand(14,46);
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,'rgba(10,6,4,0.85)');gr.addColorStop(0.5,'rgba(24,14,8,0.45)');gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
    }
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=4;
  return t;
}
function makeFoilTexture(){
  const S=256;const c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');
  g.fillStyle='#b8862f';g.fillRect(0,0,S,S);
  for(let i=0;i<420;i++){
    g.strokeStyle='rgba('+randi(200,255)+','+randi(150,215)+','+randi(60,140)+','+(0.05+rand()*0.35).toFixed(2)+')';
    g.lineWidth=rand(0.5,2.6);
    g.beginPath();
    let x=rand(0,S),y=rand(0,S);g.moveTo(x,y);
    for(let k=0;k<3;k++){x+=rand(-40,40);y+=rand(-40,40);g.lineTo(x,y);}
    g.stroke();
  }
  for(let i=0;i<60;i++){
    g.fillStyle='rgba(30,18,4,'+(0.05+rand()*0.16).toFixed(2)+')';
    g.beginPath();g.ellipse(rand(0,S),rand(0,S),rand(4,24),rand(3,14),rand(0,3.14),0,6.283);g.fill();
  }
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function makeSolarTexture(){
  const S=256;const c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');
  g.fillStyle='#0a1230';g.fillRect(0,0,S,S);
  const n=8, cell=S/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const v=randi(0,22);
    g.fillStyle='rgb('+(16+v)+','+(30+v)+','+(84+v*2)+')';
    g.fillRect(i*cell+1.5,j*cell+1.5,cell-3,cell-3);
    g.strokeStyle='rgba(150,180,255,0.20)';g.lineWidth=1;
    for(let k=1;k<4;k++){g.beginPath();g.moveTo(i*cell+1.5,j*cell+1.5+k*(cell-3)/4);g.lineTo(i*cell+cell-1.5,j*cell+1.5+k*(cell-3)/4);g.stroke();}
  }
  g.strokeStyle='rgba(190,205,235,0.55)';g.lineWidth=2;
  for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*cell,0);g.lineTo(i*cell,S);g.stroke();g.beginPath();g.moveTo(0,i*cell);g.lineTo(S,i*cell);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function radialSprite(inner,outer,pow){
  const S=128;const c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');
  const im=g.createImageData(S,S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const dx=(x-S/2)/(S/2), dy=(y-S/2)/(S/2);
    const d=Math.min(1,Math.sqrt(dx*dx+dy*dy));
    const a=Math.pow(1-d,pow);
    const i=(y*S+x)*4;
    im.data[i]=lerp(outer[0],inner[0],a)|0;
    im.data[i+1]=lerp(outer[1],inner[1],a)|0;
    im.data[i+2]=lerp(outer[2],inner[2],a)|0;
    im.data[i+3]=(clamp(a,0,1)*255)|0;
  }
  g.putImageData(im,0,0);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function ringSprite(){
  const S=128;const c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  g.strokeStyle='rgba(255,220,180,0.55)';g.lineWidth=7;
  g.beginPath();g.arc(S/2,S/2,S/2-9,0,6.283);g.stroke();
  g.strokeStyle='rgba(160,200,255,0.35)';g.lineWidth=3;
  g.beginPath();g.arc(S/2,S/2,S/2-19,0,6.283);g.stroke();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function streakSprite(){
  const S=256;const c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,S,0);
  gr.addColorStop(0,'rgba(90,150,255,0)');gr.addColorStop(0.5,'rgba(190,220,255,0.85)');gr.addColorStop(1,'rgba(90,150,255,0)');
  g.fillStyle=gr;g.fillRect(0,S/2-4,S,8);
  g.filter='blur(3px)';g.drawImage(c,0,0);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

const TEX={};
(function buildTextures(){
  const e=makeEarthTextures();
  TEX.earth=new THREE.CanvasTexture(e.day);
  TEX.earth.colorSpace=THREE.SRGBColorSpace;TEX.earth.wrapS=THREE.RepeatWrapping;TEX.earth.wrapT=THREE.ClampToEdgeWrapping;
  TEX.earth.repeat.set(8,1);TEX.earth.anisotropy=8;
  TEX.lights=new THREE.CanvasTexture(e.lights);
  TEX.lights.colorSpace=THREE.SRGBColorSpace;TEX.lights.wrapS=THREE.RepeatWrapping;TEX.lights.repeat.set(8,1);
  TEX.clouds=new THREE.CanvasTexture(e.clouds);
  TEX.clouds.colorSpace=THREE.SRGBColorSpace;TEX.clouds.wrapS=THREE.RepeatWrapping;TEX.clouds.repeat.set(6,1);TEX.clouds.anisotropy=8;
  TEX.hull=makeHullTexture('#8d9199','rgba(20,22,26,0.75)',false);
  TEX.hullDamaged=makeHullTexture('#7b7d82','rgba(16,16,18,0.85)',true);
  TEX.hullDark=makeHullTexture('#54585f','rgba(12,14,18,0.8)',false);
  TEX.foil=makeFoilTexture();
  TEX.solar=makeSolarTexture();
  TEX.glow=radialSprite([255,255,255],[80,120,255],2.4);
  TEX.spark=radialSprite([255,250,225],[255,140,40],1.6);
  TEX.sun=radialSprite([255,255,255],[255,170,80],2.0);
  TEX.star=radialSprite([255,255,255],[120,150,220],2.2);
  TEX.ring=ringSprite();
  TEX.streak=streakSprite();
})();

const atmoVert=`
#include <common>
#include <logdepthbuf_pars_vertex>
varying vec3 vN; varying vec3 vW;
void main(){
  vN = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position,1.0);
  vW = wp.xyz;
  vec4 mvPosition = viewMatrix * wp;
  gl_Position = projectionMatrix * mvPosition;
  #include <logdepthbuf_vertex>
}`;
const atmoFrag=`
#include <common>
#include <logdepthbuf_pars_fragment>
uniform vec3 uSun; uniform vec3 uDay; uniform vec3 uHorizon; uniform float uPow; uniform float uStrength;
varying vec3 vN; varying vec3 vW;
void main(){
  #include <logdepthbuf_fragment>
  vec3 V = normalize(cameraPosition - vW);
  vec3 N = normalize(vN);
  float rim = pow(1.0 - abs(dot(N,V)), uPow);
  float sunAmt = dot(N, uSun);
  float lit = smoothstep(-0.45, 0.35, sunAmt);
  float grazing = pow(1.0 - abs(sunAmt), 3.0);
  vec3 col = mix(uHorizon, uDay, smoothstep(0.0,0.55,sunAmt));
  col += uHorizon * grazing * 0.7;
  float a = rim * uStrength * (0.06 + 1.05*lit);
  gl_FragColor = vec4(col * (0.35 + 1.35*lit), a);
}`;
const atmoInner=new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_R*1.016,72,44),
  new THREE.ShaderMaterial({
    uniforms:{uSun:{value:SUN_DIR.clone()},uDay:{value:new THREE.Color(0x4d8fe8)},uHorizon:{value:new THREE.Color(0xff9c4a)},uPow:{value:3.2},uStrength:{value:1.35}},
    vertexShader:atmoVert,fragmentShader:atmoFrag,
    transparent:true,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false
  })
);
earthGroup.add(atmoInner);
const atmoOuter=new THREE.Mesh(
  new THREE.SphereGeometry(EARTH_R*1.055,64,40),
  new THREE.ShaderMaterial({
    uniforms:{uSun:{value:SUN_DIR.clone()},uDay:{value:new THREE.Color(0x2f6dd0)},uHorizon:{value:new THREE.Color(0xff7a2a)},uPow:{value:2.1},uStrength:{value:0.5}},
    vertexShader:atmoVert,fragmentShader:atmoFrag,
    transparent:true,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false
  })
);

// stars
(function(){
  const N=1800, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const c=new THREE.Color();
  for(let i=0;i<N;i++){
    const u=rand(-1,1), th=rand(0,Math.PI*2), r=15000;
    const s=Math.sqrt(1-u*u);
    pos[i*3]=r*s*Math.cos(th);pos[i*3+1]=r*u;pos[i*3+2]=r*s*Math.sin(th);
    const b=Math.pow(rand(0.15,1),2.1);
    c.setHSL(rand(0.52,0.68),rand(0.0,0.45),clamp(0.35+b*0.65,0,1));
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  const g=new THREE.BufferGeometry();

const thrusters=[];
function addThruster(parent,pos,dir,scale,color){
  const g=new THREE.Group();g.position.copy(pos);parent.add(g);
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  g.quaternion.copy(q);
  const nozzle=cyl(0.055*scale,0.10*scale,0.14*scale,8,M.dark,g);
  nozzle.position.y=0.06*scale;
  const plume=new THREE.Mesh(new THREE.ConeGeometry(0.085*scale,0.62*scale,8,1,true),additive(color||0x99ccff,0.55));
  plume.position.y=0.34*scale;plume.rotation.x=Math.PI;
  g.add(plume);
  const core=new THREE.Mesh(new THREE.ConeGeometry(0.04*scale,0.30*scale,7,1,true),additive(0xffffff,0.8));
  core.position.y=0.19*scale;core.rotation.x=Math.PI;g.add(core);
  const flash=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.glow,color:color||0x99ccff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  flash.scale.setScalar(0.5*scale);flash.position.y=0.1*scale;g.add(flash);
  const th={group:g,plume,core,flash,scale,level:0};
  th.set=(v,tt)=>{
    const f=clamp(v,0,1);
    const fl=f*(0.78+0.22*Math.sin(tt*47.0+pos.x*13.0+pos.z*7.0));
    plume.visible=core.visible=f>0.01;
    plume.scale.set(0.6+fl*0.8,fl*1.25+0.05,0.6+fl*0.8);
    core.scale.set(0.7+fl*0.5,fl*1.1+0.05,0.7+fl*0.5);
    plume.material.opacity=0.55*fl;core.material.opacity=0.85*fl;
    flash.material.opacity=0.9*fl;flash.scale.setScalar((0.35+0.45*fl)*scale);
  };
  thrusters.push(th);
  return th;
}

// tumble integral (deterministic lookup)
const TUMBLE_N=2048, tumbleTable=new Float32Array(TUMBLE_N+1);
(function(){
  let acc=0; const dt=DUR/TUMBLE_N;
  for(let i=0;i<=TUMBLE_N;i++){
    const t=i*dt;
    tumbleTable[i]=acc;
    const rate=1.0-smoothstep(T_DETUMBLE_A,T_DETUMBLE_B,t);
    acc+=rate*dt;
  }
  const total=tumbleTable[TUMBLE_N];
  for(let i=0;i<=TUMBLE_N;i++) tumbleTable[i]/=total;
})();
function tumbleS(t){
  const x=clamp(t/DUR,0,1)*TUMBLE_N;
  const i=Math.floor(x), f=x-i;
  return lerp(tumbleTable[Math.min(i,TUMBLE_N)],tumbleTable[Math.min(i+1,TUMBLE_N)],f);
}

function updateSatellite(t){
  // drifting position (period 32s -> loops)
  const w=Math.PI*2/DUR;
  satellite.position.set(
    1.6*Math.sin(w*t)+0.5*Math.sin(2*w*t+1.1),
    0.9*Math.sin(2*w*t+0.4),
    1.2*Math.sin(w*t+2.2)
  );
  const S=tumbleS(t), ang=Math.PI*2*S;
  const damp=1.0-smoothstep(T_DETUMBLE_A,T_DETUMBLE_B,t);
  _q1.setFromAxisAngle(AX1,ang);                                   // primary spin (loops exactly)
  _q2.setFromAxisAngle(AX2,0.24*Math.sin(w*t)*damp);               // nutation wobble (loops exactly)
  satellite.quaternion.copy(Q_BASE).multiply(_q2).multiply(_q1);
  satellite.updateMatrixWorld(true);
}

function updateSatelliteState(t){
  const repaired=t>=T_REPAIR;
  const rp=smoothstep(T_REPAIR,T_REPAIR+0.55,t);
  // nav lights
  for(let i=0;i<navLights.length;i++){
    const nl=navLights[i];
    const blink=(Math.sin(t*7.4+i*1.7)>0.15)?1:0.12;
    if(!repaired){
      nl.bulb.material.color.setRGB(1.0*blink,0.10*blink,0.03*blink);
      nl.halo.material.color.setRGB(1.0,0.16,0.05);
      nl.halo.material.opacity=0.35+0.65*blink;
      nl.halo.scale.setScalar(0.65+0.35*blink);
    } else {
      const g=lerp(blink,1.0,rp);
      nl.bulb.material.color.setRGB(lerp(1.0,0.10,rp)*g,lerp(0.10,1.0,rp)*g,lerp(0.03,0.45,rp)*g);
      nl.halo.material.color.setRGB(lerp(1.0,0.14,rp),lerp(0.16,1.0,rp),lerp(0.05,0.55,rp));
      nl.halo.material.opacity=lerp(0.35+0.65*blink,0.85,rp);
      nl.halo.scale.setScalar(lerp(0.65+0.35*blink,0.8,rp));
    }
  }
  // socket glow after install
  const glowAmt=smoothstep(T_INSERT_END-0.35,T_REPAIR+0.5,t);
  socketGlow.material.opacity=glowAmt*0.85;
  modHalo.material.opacity=glowAmt*0.9+0.06;
  for(const m of modGlowMats) m.opacity=0.35+0.6*(0.6+0.4*Math.sin(t*3.1))*(0.35+0.65*glowAmt);

  // solar wings
  const wings=[wingR,wingL];
  for(let wi=0;wi<2;wi++){
    const wg=wings[wi];
    const off=wi*0.55;
    const swing=kf(t,[[0,1],[T_ARRAY_A+off,1],[T_ARRAY_A+2.4+off,0],[DUR,0]]);
    wg.yoke.rotation.y=wg.dir*Math.PI/2*swing;
    const h2=kf(t,[[0,1],[T_ARRAY_A+1.9+off,1],[T_ARRAY_A+3.9+off,0],[DUR,0]]);
    const h3=kf(t,[[0,1],[T_ARRAY_A+2.6+off,1],[T_ARRAY_A+4.8+off,0],[DUR,0]]);
    wg.hinges[0].rotation.z=0;
    wg.hinges[1].rotation.z=wg.dir*2.95*h2;
    wg.hinges[2].rotation.z=-wg.dir*2.95*h3;
    // gentle flex once deployed
    const flex=(1-h2)*0.02*Math.sin(t*2.2+wi);
    wg.hinges[1].rotation.z+=flex;
  }

  // sparks
  const active=t<T_REPAIR;
  const srcLocal=_v1.set(0,0,0.36);
  couplerRoot.updateWorldMatrix(true,false);
  satellite.updateWorldMatrix(true,false);
  _m1.copy(satellite.matrixWorld).invert().multiply(couplerRoot.matrixWorld);
  const src=_v2.copy(srcLocal).applyMatrix4(_m1);
  damageFlash.position.copy(src);
  const pa=sparkGeo.attributes.position, ca=sparkGeo.attributes.color;
  let burstEnv=0;
  if(active){
    const cyc=(t*0.9)%1.0;
    burstEnv=Math.pow(Math.max(0,Math.sin(cyc*Math.PI*2)*0.5+0.5),3.0);
    burstEnv=Math.max(burstEnv, (hash1(Math.floor(t*6))>0.72)?0.85:0.0);
    burstEnv*=1.0-smoothstep(T_INSERT_END-0.5,T_REPAIR,t);   // dies as the new module seats
  }
  for(let i=0;i<SPARK_N;i++){
    const d=sparkData[i];
    const cycle=(t*(1.4+d.burst*0.23)+d.phase);
    const life=cycle-Math.floor(cycle);
    const on=active && (life<d.life) && (burstEnv>0.10 || d.burst<2);
    if(on){
      const u=life/d.life;
      const dist=d.spd*u*0.55;
      pa.array[i*3]=src.x+d.dir.x*dist+Math.sin(u*9+i)*0.02;
      pa.array[i*3+1]=src.y+d.dir.y*dist-0.05*u*u;
      pa.array[i*3+2]=src.z+d.dir.z*dist;
      const fade=(1-u)*(0.4+0.6*burstEnv);
      ca.array[i*3]=1.0*fade;ca.array[i*3+1]=0.62*fade*(1-u*0.5);ca.array[i*3+2]=0.22*fade*(1-u);
    } else {
      pa.array[i*3]=src.x;pa.array[i*3+1]=src.y;pa.array[i*3+2]=src.z;
      ca.array[i*3]=0;ca.array[i*3+1]=0;ca.array[i*3+2]=0;
    }
  }
  pa.needsUpdate=true;ca.needsUpdate=true;
  sparks.visible=active;
  damageFlash.material.opacity=active?(0.18+0.55*burstEnv):0.0;
  damageFlash.scale.setScalar(active?(1.0+1.6*burstEnv):0.01);

  // arcs
  const arcOn=active && (hash1(Math.floor(t*11))>0.55);
  arcs.visible=arcOn;
  if(arcOn){
    let k=0;
    for(let a=0;a<ARC_N;a++){
      const seedA=Math.floor(t*11)*3+a;
      let px=src.x+ (hash1(seedA*3.1)-0.5)*0.2, py=src.y+(hash1(seedA*5.7)-0.5)*0.2, pz=src.z;
      for(let s=0;s<ARC_SEG;s++){
        const nx=px+(hash1(seedA*7.3+s*2.1)-0.5)*0.26;
        const ny=py+(hash1(seedA*9.1+s*3.3)-0.5)*0.26;
        const nz=pz+(hash1(seedA*11.7+s*4.5)-0.5)*0.18;
        arcPos[k++]=px;arcPos[k++]=py;arcPos[k++]=pz;
        arcPos[k++]=nx;arcPos[k++]=ny;arcPos[k++]=nz;
        px=nx;py=ny;pz=nz;
      }
    }
    arcGeo.attributes.position.needsUpdate=true;
    arcs.material.opacity=0.55+0.45*hash1(Math.floor(t*23));
  }
}

function updateCraft(t){
  anchorWorld(dockNode,dockWorldP,dockWorldQ);   // world pose of dock node
  const d=craftDistance(t);
  const blendDir=smoothstep(4.5,10.5,t);
  const blendRot=smoothstep(5.0,11.5,t);
  // approach direction: great-circle blend from world-fixed corridor to live docking axis
  _v2.set(0,-1,0).applyQuaternion(satellite.quaternion).normalize();
  _q3.setFromUnitVectors(APPROACH_DIR,_v2);
  _q1.identity().slerp(_q3,blendDir);
  approachDirWorld.copy(APPROACH_DIR).applyQuaternion(_q1).normalize();
  _v3.copy(approachDirWorld);
  // lateral station-keeping error that decays as it closes
  const lat=Math.max(0,d-0.4);
  const wob=_v1.set(Math.sin(t*0.7)*0.10,Math.cos(t*0.55)*0.08,Math.sin(t*0.9+1.4)*0.09).multiplyScalar(lat*0.5);
  craft.position.copy(dockWorldP).addScaledVector(_v3,d).add(wob);
  // orientation: nose (+Z) toward dock point -> blend into rigid docked pose
  _v1.copy(dockWorldP);
  _m1.lookAt(_v1,craft.position,_v2.set(0,0,-1).applyQuaternion(satellite.quaternion));
  _q1.setFromRotationMatrix(_m1);
  _q2.copy(dockWorldQ);
  craft.quaternion.copy(_q1).slerp(_q2,blendRot);
  craft.updateMatrixWorld(true);

  // thruster logic
  const closing=-(craftDistance(t+0.06)-craftDistance(t-0.06))/0.12; // closing speed
  const mainOn=smoothstep(0.05,0.6,t)*(1.0-smoothstep(5.0,6.4,t))*0.9;
  mainPlume.visible=mainCore.visible=mainOn>0.01;
  const fl=mainOn*(0.85+0.15*Math.sin(t*39.0));
  mainPlume.scale.set(0.75+fl*0.5,0.4+fl*0.9,0.75+fl*0.5);
  mainCore.scale.set(0.8+fl*0.3,0.4+fl*0.8,0.8+fl*0.3);
  mainPlume.material.opacity=0.5*fl;mainCore.material.opacity=0.9*fl;
  mainFlash.material.opacity=0.95*fl;mainFlash.scale.setScalar(1.1+1.4*fl);

  const braking=(t>6.0&&t<T_CONTACT)?clamp(closing*0.36,0,1)*(0.55+0.45*Math.sin(t*8.0)):0;
  const detumble=(t>T_DETUMBLE_A&&t<T_DETUMBLE_B+0.4)?(1.0-smoothstep(T_DETUMBLE_A,T_DETUMBLE_B,t))*0.85:0;
  for(let i=0;i<rcsBrake.length;i++) rcsBrake[i].set(braking*(0.7+0.3*Math.sin(t*11+i)),t);
  for(let i=0;i<rcsAft.length;i++) rcsAft[i].set(mainOn>0.05?0.0:(t>7&&t<9.5?0.25*Math.max(0,Math.sin(t*5+i)):0),t);
  for(let i=0;i<rcsRoll.length;i++){
    let v=0;
    if(t>7.5&&t<T_CONTACT) v=0.55*Math.max(0,Math.sin(t*(3.1+i*0.7)+i*2.1));
    v=Math.max(v,detumble*Math.max(0,Math.sin(t*(2.2+i*0.9)+i)));
    rcsRoll[i].set(v,t);
  }
  // craft lights blink
  const strobe=(Math.sin(t*6.0)>0.86)?1:0;
  craftLights[2].h.material.opacity=strobe?1:0.05;
  craftLights[2].b.material.color.setScalar(strobe?1:0.06);
  craftLights[0].h.material.opacity=0.75;craftLights[1].h.material.opacity=0.75;

  // arms
  const ext=smoothstep(10.6,13.2,t);
  const close=smoothstep(13.7,14.55,t);
  const arms=[armR,armL];
  for(let i=0;i<arms.length;i++){
    const a=arms[i];
    a.shoulder.rotation.x=lerp(-1.45,-0.55,ext)+0.025*Math.sin(t*1.7+i);
    a.shoulder.rotation.y=a.side*lerp(0.62,0.14,ext);
    a.elbow.rotation.x=lerp(2.30,1.00,ext);
    a.wrist.rotation.x=lerp(-0.80,-0.18,ext);
    const open=lerp(0.62,0.03,close);
    a.jaws[0].rotation.x=-open;
    a.jaws[1].rotation.x=open;
    a.magGlow.material.opacity=close*0.85*(0.7+0.3*Math.sin(t*5.0+i));
  }
  // bay hatch
  const hatchOpen=smoothstep(T_DRONE_OUT-0.9,T_DRONE_OUT-0.1,t)*(1.0-smoothstep(T_DRONE_HOME+0.2,T_DRONE_HOME+0.9,t));
  hatch.rotation.x=-hatchOpen*1.35;
  bayLight.material.opacity=hatchOpen*0.7;
}

function updateDroneAndParts(t){
  anchorInSat(socketAnchor,socketSatP,socketSatQ);
  anchorInSat(bayAnchor,baySatP,baySatQ);

  // drone yaw: 0 leaving bay -> PI facing coupler -> 2PI returning
  const yaw=kf(t,[[T_DRONE_OUT,0.0],[16.4,1.1],[17.5,Math.PI],[T_INSERT_END+0.6,Math.PI],[22.0,Math.PI*1.7],[T_DRONE_HOME,Math.PI*2]]);
  const pitch=0.06*Math.sin(t*1.9), roll=0.05*Math.sin(t*1.4+1.0);
  drone.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,roll,'YXZ'));

  // work poses derived from claw offsets so tips land exactly on the socket
  const faceQ=_q1.setFromEuler(new THREE.Euler(0,Math.PI,0));
  const clawBoff=_v1.copy(clawB.off).applyQuaternion(faceQ);
  const clawAoff=_v2.copy(clawA.off).applyQuaternion(faceQ);
  const socketFace=_v3.copy(socketSatP);
  const engagedB=new THREE.Vector3().copy(socketFace).sub(clawBoff);
  const engagedA=new THREE.Vector3().copy(socketFace).sub(clawAoff);
  const backB=engagedB.clone().add(new THREE.Vector3(0,0,0.75));
  const backA=engagedA.clone().add(new THREE.Vector3(0,0,0.75));

  const path=[
    [T_DRONE_OUT,        [baySatP.x,baySatP.y,baySatP.z]],
    [T_DRONE_OUT+0.75,   [baySatP.x+0.22,baySatP.y-0.18,baySatP.z+1.30]],
    [16.9,               [0.95,-2.0,3.55]],
    [17.6,               [0.85,-0.35,3.75]],
    [18.05,              [backB.x,backB.y,backB.z]],
    [T_GRAB,             [engagedB.x,engagedB.y,engagedB.z]],
    [T_GRAB+0.35,        [engagedB.x,engagedB.y,engagedB.z]],
    [19.35,              [backB.x,backB.y+0.05,backB.z+0.12]],
    [19.85,              [backA.x,backA.y+0.05,backA.z+0.12]],
    [T_INSERT_END,       [engagedA.x,engagedA.y,engagedA.z]],
    [T_INSERT_END+0.55,  [backA.x,backA.y+0.15,backA.z+0.25]],
    [21.9,               [-1.15,-1.0,3.85]],
    [22.8,               [0.2,-2.9,2.7]],
    [T_DRONE_HOME,       [baySatP.x,baySatP.y,baySatP.z]]
  ];
  kfv(t,path,drone.position);
  // tiny hover jitter while working
  const jit=smoothstep(17.4,17.9,t)*(1-smoothstep(T_INSERT_END+0.4,T_INSERT_END+0.9,t));
  drone.position.x+=Math.sin(t*5.3)*0.008*jit;
  drone.position.y+=Math.sin(t*4.1+1.3)*0.010*jit;
  drone.visible=(t>=T_DRONE_OUT-0.05)&&(t<=T_DRONE_HOME+0.1);

  // claw fingers
  const gripB=smoothstep(T_GRAB-0.18,T_GRAB+0.12,t);
  const openB=1-gripB;
  clawB.fingers[0].rotation.z=lerp(-0.55,-0.06,gripB);
  clawB.fingers[1].rotation.z=lerp(0.55,0.06,gripB);
  const releaseA=smoothstep(T_INSERT_END-0.05,T_INSERT_END+0.35,t);
  clawA.fingers[0].rotation.z=lerp(-0.10,-0.6,releaseA);
  clawA.fingers[1].rotation.z=lerp(0.10,0.6,releaseA);

  // drone thrusters pulse on movement
  const moving=smoothstep(T_DRONE_OUT,T_DRONE_OUT+0.3,t)*(1-smoothstep(T_DRONE_HOME-0.4,T_DRONE_HOME,t));
  for(let i=0;i<droneThr.length;i++){
    const v=moving*(0.18+0.5*Math.max(0,Math.sin(t*(4.0+i*1.3)+i*2.0)));
    droneThr[i].set(drone.visible?v:0,t);
  }
  dEyeGlow.material.opacity=drone.visible?0.85:0;

  drone.updateMatrixWorld(true);

  // ---- broken part continuity ----
  anchorInSat(clawB.anchor,tmpP,tmpQ);
  const kBroken=smoothstep(T_EXTRACT,T_EXTRACT+0.3,t);
  brokenPart.position.copy(socketSatP).lerp(tmpP,kBroken);
  brokenPart.quaternion.copy(socketSatQ).slerp(tmpQ,kBroken);
  brokenPart.visible=t<T_DRONE_HOME+0.05;

  // ---- new module continuity ----
  anchorInSat(clawA.anchor,tmpP2,tmpQ2);
  const kNew=smoothstep(T_INSERT_END-0.4,T_INSERT_END,t);
  newModule.position.copy(tmpP2).lerp(socketSatP,kNew);
  newModule.quaternion.copy(tmpQ2).slerp(socketSatQ,kNew);
  newModule.visible=t>=T_DRONE_OUT-0.05;
}

function updateWorld(t){
  const f=t/DUR;
  earthGroup.rotation.y=-f*(Math.PI*2/8);   // exactly one texture tile -> seamless loop
  clouds.rotation.y=-f*(Math.PI*2/6);       // exactly one cloud tile -> seamless loop
  for(const d of debris){
    const w=Math.PI*2/DUR;
    d.m.position.set(
      d.base.x+d.amp.x*Math.sin(w*t+d.ph.x),
      d.base.y+d.amp.y*Math.sin(w*t+d.ph.y),
      d.base.z+d.amp.z*Math.sin(w*t+d.ph.z)
    );
    d.m.quaternion.setFromAxisAngle(d.axis,Math.PI*2*d.spin*f);
    // never let a chunk clip the lens or crowd the subject
    d.m.visible=d.m.position.distanceTo(camera.position)>3.2 && d.m.position.distanceTo(satellite.position)>7.0;
  }
}

/* ============================================================
   16. CAMERA CHOREOGRAPHY
   ============================================================ */
const satUp=new THREE.Vector3();
const damped=new THREE.Quaternion();
const IDQ=new THREE.Quaternion();

function frameQuat(k){ return damped.copy(IDQ).slerp(satellite.quaternion,k); }
function satPoint(lx,ly,lz,out){ return (out||new THREE.Vector3()).set(lx,ly,lz).applyMatrix4(satellite.matrixWorld); }
function offsetFrom(basePos,q,ox,oy,oz,out){
  out=out||new THREE.Vector3();
  out.set(ox,oy,oz).applyQuaternion(q).add(basePos);
  return out;
}
const shake=(t,f,a)=>Math.sin(t*f)*a+Math.sin(t*f*1.7+1.1)*a*0.5;

function updateCamera(t){
  const satP=satellite.position;
  let fov=40, roll=0;
  const up=camUpV.set(0,1,0);

  if(t<SHOTS[0].t1){
    // SHOT 1 — debris-level approach (wide, world space)
    const u=(t-SHOTS[0].t0)/(SHOTS[0].t1-SHOTS[0].t0);
    camPosV.set(
      lerp(-17.5,-11.5,ease(u)),
      lerp(4.6,2.8,ease(u)),
      lerp(-47.0,-33.5,ease(u))
    );
    camPosV.x+=shake(t,0.7,0.28);camPosV.y+=shake(t+3,0.55,0.22);
    // frame satellite slightly left, incoming craft behind it
    camTargetV.copy(satP).add(_v1.set(lerp(3.2,1.4,u),lerp(-0.6,0.2,u),lerp(9.0,4.0,u)));
    fov=lerp(42,38,ease(u));
    roll=0.012*Math.sin(t*0.4);
  } else if(t<SHOTS[1].t1){
    // SHOT 2 — side tracking of the closing service craft
    const u=(t-SHOTS[1].t0)/(SHOTS[1].t1-SHOTS[1].t0), e=ease(u);
    const f=approachDirWorld;                        // dock -> craft (backwards along corridor)
    _v2.set(0,1,0).cross(f).normalize();             // side
    _v3.copy(f).cross(_v2).normalize();              // up-ish
    camPosV.copy(craft.position)
      .addScaledVector(f,lerp(6.0,2.5,e))
      .addScaledVector(_v2,-lerp(10.0,6.5,e))
      .addScaledVector(_v3,lerp(2.6,1.5,e));
    camPosV.x+=shake(t,0.9,0.16);camPosV.y+=shake(t+7,0.75,0.14);
    camTargetV.copy(craft.position).addScaledVector(f,-lerp(4.0,7.0,e));
    fov=lerp(40,34,e);
    roll=-0.02+0.01*Math.sin(t*0.5);
  } else if(t<SHOTS[2].t1){
    // SHOT 3 — close docking: clamps closing on the satellite
    const u=(t-SHOTS[2].t0)/(SHOTS[2].t1-SHOTS[2].t0), e=ease(u);
    const f=approachDirWorld;
    _v2.set(0,1,0).cross(f).normalize();
    _v3.copy(f).cross(_v2).normalize();
    camPosV.copy(dockWorldP)
      .addScaledVector(f,lerp(3.0,0.7,e))
      .addScaledVector(_v2,lerp(13.0,8.2,e))
      .addScaledVector(_v3,-lerp(4.5,2.2,e));
    camPosV.y+=shake(t,1.1,0.07);camPosV.x+=shake(t+4,0.9,0.06);
    camTargetV.copy(dockWorldP).addScaledVector(f,lerp(1.8,-0.7,e));
    fov=lerp(38,33,e);
    roll=-0.05+0.03*Math.sin(t*0.35);
  } else if(t<SHOTS[3].t1){
    // SHOT 4 — repair drone close-up (attached frame, near coupler)
    const u=(t-SHOTS[3].t0)/(SHOTS[3].t1-SHOTS[3].t0);
    const q=frameQuat(1.0);
    const ax=kf(t,[[15.5,-3.4],[17.4,-2.6],[18.4,-1.7],[20.4,1.9],[21.5,3.0]]);
    const ay=kf(t,[[15.5,-2.2],[17.4,-0.2],[18.4,0.6],[20.4,1.1],[21.5,1.8]]);
    const az=kf(t,[[15.5,6.2],[17.4,6.4],[18.4,6.0],[20.4,5.8],[21.5,6.6]]);
    offsetFrom(satP,q,ax,ay,az,camPosV);
    camPosV.add(_v1.set(shake(t,1.6,0.025),shake(t+2,1.3,0.025),0).applyQuaternion(q));
    // target follows the actual working area (socket / drone)
    const tx=kf(t,[[15.5,0.1],[16.6,0.2],[17.8,0.15],[19.9,-0.1],[21.5,0.0]]);
    const ty=kf(t,[[15.5,-1.6],[16.8,-0.3],[17.8,0.5],[21.5,0.5]]);
    satPoint(tx,ty,2.45,camTargetV);
    if(t<16.9){ // early: include the drone leaving the bay
      satPoint(drone.position.x,drone.position.y,drone.position.z,_v1);
      camTargetV.lerp(_v1,1.0-smoothstep(15.5,16.9,t));
    }
    up.set(0,1,0).applyQuaternion(q);
    fov=lerp(37,31,smoothstep(15.5,19.0,t));
    roll=0.04*Math.sin(t*0.3);
  } else if(t<SHOTS[4].t1){
    // SHOT 5 — solar array deployment orbit
    const u=(t-SHOTS[4].t0)/(SHOTS[4].t1-SHOTS[4].t0);
    const q=frameQuat(lerp(0.9,0.25,ease(u)));
    const ang=lerp(-0.9,1.05,ease(u));
    const r=lerp(15.5,21.5,ease(u));
    const hgt=lerp(2.2,5.0,ease(u));
    offsetFrom(satP,q,Math.sin(ang)*r,hgt,Math.cos(ang)*r,camPosV);
    camPosV.x+=shake(t,0.6,0.2);camPosV.y+=shake(t+5,0.5,0.16);
    camTargetV.copy(satP).add(_v1.set(0,lerp(-0.9,-0.2,u),0));
    up.set(0,1,0).applyQuaternion(frameQuat(lerp(0.9,0.15,ease(u))));
    fov=lerp(38,42,ease(u));
    roll=0.02*Math.sin(t*0.28);
  } else {
    // SHOT 6 — wide pullback, repaired satellite crossing the sunrise
    const u=(t-SHOTS[5].t0)/(SHOTS[5].t1-SHOTS[5].t0);
    const e=ease(u);
    _v1.copy(SUN_DIR).negate();                       // anti-sun pull-back axis
    _v2.set(0,1,0).cross(_v1).normalize();            // horizontal perpendicular
    const tilt=lerp(0.46,0.36,e);
    _v3.copy(_v1).multiplyScalar(Math.cos(tilt)).addScaledVector(_v2,Math.sin(tilt)).normalize();
    const r=lerp(23.0,99.0,e);
    camPosV.copy(satP).addScaledVector(_v3,r);
    camPosV.y+=lerp(2.6,12.0,e);
    camPosV.x+=shake(t,0.42,0.3);camPosV.y+=shake(t+9,0.36,0.24);
    camTargetV.copy(satP).addScaledVector(_v2,-lerp(0,11.0,e));
    camTargetV.y+=lerp(0.2,5.0,e);
    fov=lerp(40,44,e);
    roll=0.03*Math.sin(t*0.22);
  }

  camera.fov=fov;
  camera.updateProjectionMatrix();
  camera.position.copy(camPosV);
  camera.up.copy(up);
  camera.lookAt(camTargetV);
  camera.rotateZ(roll);
}

/* ============================================================
   17. LENS FLARE UPDATE
   ============================================================ */
const _sunNDC=new THREE.Vector3();
function updateFlare(){
  camera.updateMatrixWorld(true);
  const camPos=camera.position;
  // occlusion by Earth
  _v1.copy(SUN_POS).sub(camPos).normalize();
  _v2.set(0,EARTH_CY,0).sub(camPos);
  const proj=_v2.dot(_v1);
  let vis=1.0;
  if(proj>0){
    const perp=Math.sqrt(Math.max(0,_v2.lengthSq()-proj*proj));
    vis=smoothstep(EARTH_R*0.998,EARTH_R*1.030,perp);
  }
  camera.getWorldDirection(_v3);
  const facing=_v3.dot(_v1);
  vis*=smoothstep(0.30,0.72,facing);
  _sunNDC.copy(SUN_POS).project(camera);
  const sx=_sunNDC.x, sy=_sunNDC.y;
  const edge=1.0-smoothstep(0.9,1.9,Math.hypot(sx,sy));
  vis*=edge;
  const aspect=16/9;
  for(let i=0;i<flareEls.length;i++){
    const f=flareEls[i];
    f.s.position.set(sx*(1.0-f.offset),sy*(1.0-f.offset),0);
    const sc=f.size*(0.85+0.30*Math.hypot(sx,sy)*(f.offset!==0?1:0));
    f.s.scale.set(sc/aspect,sc,1);
    f.s.material.opacity=f.base*vis;
    f.s.visible=vis>0.01;
  }
}

/* ============================================================
   18. RESIZE + LOOP
   ============================================================ */
function resize(){
  const w=Math.max(2,Math.round(frameEl.clientWidth));
  const h=Math.max(2,Math.round(frameEl.clientHeight));
  const rw=Math.min(w,1600), rh=Math.round(rw*9/16);
  renderer.setSize(rw,rh,false);
  renderer.domElement.style.width='100%';
  renderer.domElement.style.height='100%';
  composer.setSize(rw,rh);
  bloom.setSize(rw,rh);
  gradePass.uniforms.uRes.value.set(rw,rh);
  camera.aspect=16/9;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
resize();

const clock=new THREE.Clock();
let elapsed=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  const t=elapsed%DUR;

  updateSatellite(t);
  updateSatelliteState(t);
  updateCraft(t);
  updateDroneAndParts(t);
  updateCamera(t);
  updateWorld(t);
  updateFlare();

  const fade=smoothstep(0.0,0.65,t)*(1.0-smoothstep(DUR-0.7,DUR,t));
  gradePass.uniforms.uFade.value=fade;
  gradePass.uniforms.uTime.value=t;

  composer.render();
  renderer.autoClear=false;
  renderer.render(flareScene,flareCam);
  renderer.autoClear=true;
}
tick();
</script>
