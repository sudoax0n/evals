<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// --- deterministic RNG ---
function mulberry32(a){ return function(){ let t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,61|t); return ((t^t>>>14)>>>0)/4294967296; } }
const rng = mulberry32(0x2A1B3C4D);
const R = ()=>rng();
const Rr = (a,b)=>a+(b-a)*R();

// helper
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(t)=>t*t*(3-2*t);
const easeOutCubic=(t)=>1-Math.pow(1-t,3);
const easeInOutCubic=(t)=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

const DURATION=32;

// --- renderer / scene ---
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance', alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02050d);
scene.fog=new THREE.Fog(0x02050d, 45, 120);

const camera=new THREE.PerspectiveCamera(44, 16/9, 0.1, 3000);
let composer, bloomPass;
let useComposer=true;
try{
  const rt=new THREE.Vector2();
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(1920,1080), 0.58, 0.45, 0.62);
  composer.addPass(bloomPass);
}catch(e){ useComposer=false; }


// --- lights ---
const ambient=new THREE.AmbientLight(0x8ea0c8, .35);
scene.add(ambient);
const hemi=new THREE.HemisphereLight(0x6a8bd5, 0x04060a, .45);
scene.add(hemi);
// sun low on horizon for sunrise
const sunPos=new THREE.Vector3(280, 22, -140);
const sunLight=new THREE.DirectionalLight(0xfff2d6, 2.6);
sunLight.position.copy(sunPos);
scene.add(sunLight);
const sunFill=new THREE.DirectionalLight(0x8fb6ff, .55);
sunFill.position.set(-80, 40, 80);
scene.add(sunFill);
const rimLight=new THREE.PointLight(0x6ec6ff, 6, 40);
rimLight.position.set(0, -12, 6);
scene.add(rimLight);

// --- stars ---
{
  const g=new THREE.BufferGeometry();
  const N=5200;
  const pos=new Float32Array(N*3);
  const col=new Float32Array(N*3);
  const sz=new Float32Array(N);
  for(let i=0;i<N;i++){
    // uniform sphere shell
    const u=R(), v=R(), theta=2*Math.PI*u, phi=Math.acos(2*v-1);
    const r= 420 + Rr(0,380);
    pos[i*3]= r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]= r*Math.sin(phi)*Math.sin(theta)*0.9 + Rr(-30,30);
    pos[i*3+2]= r*Math.cos(phi);
    const c=R();
    if(c>0.92){ col[i*3]=1; col[i*3+1]=0.92; col[i*3+2]=0.75; }
    else if(c>0.6){ col[i*3]=0.78; col[i*3+1]=0.85; col[i*3+2]=1;}
    else { col[i*3]=0.66; col[i*3+1]=0.74; col[i*3+2]=0.98; }
    sz[i]= Rr(0.3,1.35) * (c>0.94?1.6:1);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.setAttribute('size', new THREE.BufferAttribute(sz,1));
  const m=new THREE.PointsMaterial({size:0.9, vertexColors:true, transparent:true, opacity:0.92, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false});
  const pts=new THREE.Points(g,m);
  scene.add(pts);
}

// --- procedural textures ---
function createEarthTexture(){
  const c=document.createElement('canvas'); c.width=1024; c.height=512;
  const ctx=c.getContext('2d');
  // ocean base
  const grad=ctx.createLinearGradient(0,0,0,512);
  grad.addColorStop(0,'#0a2e55');
  grad.addColorStop(0.5,'#0d3a68');
  grad.addColorStop(1,'#08233f');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,1024,512);
  // continents noise blobs
  ctx.fillStyle='#1e5a2a';
  function blob(nx,ny,scale,alpha){
    ctx.globalAlpha=alpha;
    ctx.beginPath();
    const pts=8+Math.floor(R()*5);
    for(let i=0;i<pts;i++){
      const a=i/pts*Math.PI*2;
      const r=scale*(0.6+R()*0.8);
      const x=nx + Math.cos(a)*r;
      const y=ny + Math.sin(a)*r*0.65;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill();
  }
  const continentColor=['#2a6b32','#2f6f35','#245a2b','#3a7a3a'];
  for(let i=0;i<28;i++){
    const x=R()*1024, y= 60+R()*380;
    const s= 28+R()*62;
    ctx.fillStyle=continentColor[Math.floor(R()*continentColor.length)];
    blob(x,y,s, 0.95);
    // coastal highlight
    ctx.fillStyle='#4a9a5b';
    blob(x+4,y+2,s*0.55,0.35);
  }
  // ice caps
  ctx.fillStyle='#e8f0ff';
  ctx.globalAlpha=0.92;
  ctx.fillRect(0,0,1024,18);
  ctx.fillRect(0,494,1024,18);
  ctx.globalAlpha=1;
  // subtle latitude bands
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  for(let y=0;y<512;y+=32){ ctx.beginPath(); ctx.moveTo(0,y+Math.sin(y*0.02)*6); for(let x=0;x<1024;x+=8) ctx.lineTo(x, y+Math.sin(x*0.015+y*0.01)*4); ctx.stroke(); }
  // terminator darkening
  const grad2=ctx.createLinearGradient(0,0,1024,0);
  grad2.addColorStop(0,'rgba(0,6,20,0.0)');
  grad2.addColorStop(0.55,'rgba(0,6,20,0.0)');
  grad2.addColorStop(0.78,'rgba(0,8,28,0.55)');
  grad2.addColorStop(1,'rgba(0,4,18,0.88)');
  ctx.fillStyle=grad2; ctx.fillRect(0,0,1024,512);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=THREE.RepeatWrapping;
  return tex;
}
function createCloudTexture(){
  const c=document.createElement('canvas'); c.width=1024; c.height=512;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,1024,512);
  for(let i=0;i<180;i++){
    const x=R()*1024, y=R()*512;
    const rx= 18+R()*42, ry= 8+R()*14;
    const a=0.09+R()*0.17;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.ellipse(x,y,rx,ry, R()*0.3, 0, Math.PI*2);
    ctx.fill();
    // second puff
    ctx.beginPath();
    ctx.ellipse(x+Rr(-12,12), y+Rr(-6,6), rx*0.7, ry*0.7, 0,0,Math.PI*2);
    ctx.fill();
  }
  // bands
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.lineWidth=2;
  for(let y=60;y<452;y+=38){
    ctx.beginPath();
    for(let x=0;x<1024;x+=12){
      const yy=y+ Math.sin(x*0.012 + y*0.04)*10 + Rr(-2,2);
      if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  const tex=new THREE.CanvasTexture(c);
  return tex;
}
const earthTex=createEarthTexture();
const cloudTex=createCloudTexture();

// --- Earth + atmosphere + clouds ---
const earthGroup=new THREE.Group();
scene.add(earthGroup);
const EARTH_R=190;
const earthGeo=new THREE.SphereGeometry(EARTH_R, 72, 72);
const earthMat=new THREE.MeshPhongMaterial({map:earthTex, bumpScale:0.15, shininess:12, specular: new THREE.Color(0x9ab7ff), emissive:new THREE.Color(0x000a1a), emissiveIntensity:0.08});
const earthMesh=new THREE.Mesh(earthGeo, earthMat);
earthMesh.position.set(0, -EARTH_R - 6.2, -18);
earthMesh.rotation.y=0.35;
earthGroup.add(earthMesh);

// thin blue atmosphere via shader
const atmoGeo=new THREE.SphereGeometry(EARTH_R*1.015, 64,64);
const atmoMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{
    time:{value:0},
    sunDir:{value: sunPos.clone().normalize() }
  },
  vertexShader:`
    varying vec3 vNormal;
    varying vec3 vPos;
    void main(){
      vNormal=normalize(normalMatrix*normal);
      vPos=position;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }
  `,
  fragmentShader:`
    varying vec3 vNormal;
    varying vec3 vPos;
    uniform vec3 sunDir;
    void main(){
      float fres=pow(1.0 - max(0.0, dot(vNormal, vec3(0.,0.,1.))), 3.0);
      // sunrise boost near horizon sun direction
      float sunBoost=pow(max(0.0, dot(normalize(vPos), sunDir))*0.5+0.5, 8.0);
      vec3 col=mix(vec3(0.12,0.42,0.95), vec3(1.0,0.55,0.22), sunBoost*0.65);
      float alpha= fres*0.62 + sunBoost*0.22;
      // horizon line thin
      alpha*=1.1;
      gl_FragColor=vec4(col, alpha);
    }
  `
});
const atmoMesh=new THREE.Mesh(atmoGeo, atmoMat);
atmoMesh.position.copy(earthMesh.position);
earthGroup.add(atmoMesh);

// inner glow rim
const glowGeo=new THREE.SphereGeometry(EARTH_R*1.028, 64,64);
const glowMat=new THREE.MeshBasicMaterial({color:0x4da0ff, transparent:true, opacity:0.07, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false});
const glowMesh=new THREE.Mesh(glowGeo, glowMat);
glowMesh.position.copy(earthMesh.position);
earthGroup.add(glowMesh);

const cloudGeo=new THREE.SphereGeometry(EARTH_R*1.018, 64,64);
const cloudMat=new THREE.MeshLambertMaterial({map:cloudTex, transparent:true, opacity:0.42, depthWrite:false});
const cloudMesh=new THREE.Mesh(cloudGeo, cloudMat);
cloudMesh.position.copy(earthMesh.position);
earthGroup.add(cloudMesh);

// sunrise sun disc + lens flare sprite
{
  const sunGeo=new THREE.SphereGeometry(9, 24,24);
  const sunMat=new THREE.MeshBasicMaterial({color:0xfff4cc, transparent:true, opacity:0.98});
  const sunMesh=new THREE.Mesh(sunGeo, sunMat);
  sunMesh.position.copy(sunPos);
  scene.add(sunMesh);
  const flareL=new THREE.PointLight(0xff8b2a, 8, 80);
  flareL.position.copy(sunPos);
  scene.add(flareL);
  // lens flare sprites
  const spriteTex=(function(){
    const c=document.createElement('canvas'); c.width=128; c.height=128;
    const ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.2,'rgba(255,240,180,0.85)');
    g.addColorStop(0.45,'rgba(255,160,60,0.42)');
    g.addColorStop(1,'rgba(255,90,20,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  })();
  const flareSprites=[];
  const flareColors=[0xffffff,0xffd39a,0xff8f42,0x8fbfff,0xffffff];
  const flareScales=[7,4,2.2,1.4,0.9];
  const flarePosT=[-0.45,-0.2,0.05,0.28,0.52];
  for(let i=0;i<5;i++){
    const m=new THREE.SpriteMaterial({map:spriteTex, color:flareColors[i], transparent:true, opacity:0.0, blending:THREE.AdditiveBlending, depthWrite:false});
    const s=new THREE.Sprite(m);
    s.scale.set(flareScales[i],flareScales[i],1);
    s.userData.t=flarePosT[i];
    s.userData.baseOp=[0.62,0.28,0.18,0.12,0.16][i];
    scene.add(s);
    flareSprites.push(s);
  }
  scene.userData.flareSprites=flareSprites;
  scene.userData.sunMesh=sunMesh;
}

// --- satellite ---
const satelliteGroup=new THREE.Group();
satelliteGroup.position.set(0,0.2,0);
scene.add(satelliteGroup);

// body
const satBodyMat=new THREE.MeshStandardMaterial({color:0xd8dde6, metalness:0.62, roughness:0.38, envMapIntensity:0.8});
const satBodyGeo=new THREE.BoxGeometry(2.6,1.45,1.55);
const satBody=new THREE.Mesh(satBodyGeo, satBodyMat);
satBody.castShadow=false;
satelliteGroup.add(satBody);
// detail panels on body
const bodyDetailMat=new THREE.MeshStandardMaterial({color:0x9aa3b6, metalness:0.55, roughness:0.45});
for(let i=0;i<3;i++){
  const d=new THREE.Mesh(new THREE.BoxGeometry(0.82,0.06,1.2), bodyDetailMat);
  d.position.set(0,0.76, -0.35+i*0.35);
  satelliteGroup.add(d);
}
// antenna dish (parabolic)
{
  const dishGeo=new THREE.SphereGeometry(0.55, 22,14,0,Math.PI*2,0,Math.PI*0.46);
  const dishMat=new THREE.MeshStandardMaterial({color:0xcdd6e6, metalness:0.82, roughness:0.24, side:THREE.DoubleSide});
  const dish=new THREE.Mesh(dishGeo, dishMat);
  dish.rotation.x=Math.PI;
  dish.position.set(0.4,0.72, -0.05);
  dish.scale.set(1,1,0.55);
  satelliteGroup.add(dish);
  const dishRim=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.02,8,24, Math.PI*2), new THREE.MeshStandardMaterial({color:0xaab8cc, metalness:0.7, roughness:0.3}));
  dishRim.position.copy(dish.position); dishRim.position.y-=0.0; dishRim.rotation.x=Math.PI/2;
  dishRim.scale.set(1,0.55,1);
  satelliteGroup.add(dishRim);
  const feed=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.38,8), new THREE.MeshStandardMaterial({color:0x505a6a}));
  feed.position.set(0.4,1.02,-0.05);
  satelliteGroup.add(feed);
}
// comm array
{
  const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.05,6), new THREE.MeshStandardMaterial({color:0x6b7588}));
  mast.position.set(-0.7,0.9,-0.25);
  satelliteGroup.add(mast);
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.55,6), bodyDetailMat);
  ant.position.set(-0.7,1.35,-0.25); ant.rotation.z=0.45;
  satelliteGroup.add(ant);
}
// thruster block
{
  const thr=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.42,0.9), new THREE.MeshStandardMaterial({color:0x3a414d, metalness:0.6, roughness:0.55}));
  thr.position.set(0, -0.02, -0.98);
  satelliteGroup.add(thr);
  const noz=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.32,12,1,true), new THREE.MeshStandardMaterial({color:0x232830, metalness:0.85, roughness:0.4, side:THREE.DoubleSide}));
  noz.rotation.x=Math.PI; noz.position.set(0,-0.1,-1.28);
  satelliteGroup.add(noz);
}

// damaged power coupler housing
const couplerLocal=new THREE.Vector3(0, -0.38, 0.78);
const couplerGroup=new THREE.Group();
couplerGroup.position.copy(couplerLocal);
satelliteGroup.add(couplerGroup);
const couplerHousingGeo=new THREE.BoxGeometry(0.62,0.38,0.52);
const couplerHousingMat=new THREE.MeshStandardMaterial({color:0x4a525f, metalness:0.7, roughness:0.45});
const couplerHousing=new THREE.Mesh(couplerHousingGeo, couplerHousingMat);
couplerGroup.add(couplerHousing);
const couplerInner=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.22,0.38), new THREE.MeshStandardMaterial({color:0x0a0d11, metalness:0.2, roughness:0.85}));
couplerInner.position.set(0,0,0.07);
couplerGroup.add(couplerInner);
// broken module (to be removed)
const brokenMat=new THREE.MeshStandardMaterial({color:0x3d3a33, metalness:0.55, roughness:0.78, emissive:0x251508, emissiveIntensity:0.22});
const brokenModule=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.16,0.32), brokenMat);
brokenModule.position.set(0,0,0.12);
brokenModule.rotation.set(0.18,-0.22,0.14);
couplerGroup.add(brokenModule);
// cracked panel detail
const crack=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.02,0.34), new THREE.MeshStandardMaterial({color:0x0a0a0a, transparent:true, opacity:0.0}));
couplerGroup.add(crack);

// replacement glowing module (initially hidden, held by service)
const newModuleGeo=new THREE.BoxGeometry(0.40,0.18,0.34);
const newModuleMat=new THREE.MeshStandardMaterial({color:0xb8f7d0, metalness:0.35, roughness:0.35, emissive:0x18ff7a, emissiveIntensity:1.65, transparent:true, opacity:1});
const newModule=new THREE.Mesh(newModuleGeo, newModuleMat);
newModule.scale.set(1,1,1);
// add edge glow
const newModuleEdge=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.04,0.36), new THREE.MeshBasicMaterial({color:0x18ff7a, transparent:true, opacity:0.62, blending:THREE.AdditiveBlending, depthWrite:false}));
newModule.add(newModuleEdge);
newModuleEdge.position.y=0.11;
newModule.visible=false;
satelliteGroup.add(newModule); // will be positioned later world space but for now child of satellite for easy
// subtle inner light for coupler when repaired
const couplerLight=new THREE.PointLight(0x18ff7a, 0, 3.2);
couplerLight.position.copy(couplerLocal); couplerLight.position.z+=0.18;
satelliteGroup.add(couplerLight);

// warning lights (two)
const warnLights=[];
[[0.95,0.38,0.35],[ -0.92,0.38,0.35]].forEach((p,i)=>{
  const g=new THREE.SphereGeometry(0.05,10,10);
  const m=new THREE.MeshStandardMaterial({color: i===0?0xff3a2a:0xff3a2a, emissive:0xff2200, emissiveIntensity:2.2, transparent:true, opacity:1});
  const mesh=new THREE.Mesh(g,m);
  mesh.position.set(p[0],p[1],p[2]);
  satelliteGroup.add(mesh);
  // housing
  const h=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.04,10), new THREE.MeshStandardMaterial({color:0x222a36, metalness:0.7, roughness:0.4}));
  h.position.copy(mesh.position); h.position.y-=0.04;
  satelliteGroup.add(h);
  warnLights.push(mesh);
});
scene.userData.warnLights=warnLights;
scene.userData.couplerLight=couplerLight;

// solar arrays
function makeWing(isLeft){
  const wing=new THREE.Group();
  const side=isLeft?-1:1;
  wing.position.set(side*1.32, 0.05, 0);
  // hinge
  const hinge=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.32,10), new THREE.MeshStandardMaterial({color:0x5a657a, metalness:0.7, roughness:0.35}));
  hinge.rotation.z=Math.PI/2;
  hinge.position.set(side*0.08,0,0);
  wing.add(hinge);
  const panels=[];
  const panelMat=new THREE.MeshStandardMaterial({color:0x0b1230, metalness:0.12, roughness:0.22, emissive:0x0a1a5a, emissiveIntensity:0.18});
  const cellMat=new THREE.MeshStandardMaterial({color:0x15265a, metalness:0.0, roughness:0.5});
  for(let i=0;i<3;i++){
    const pg=new THREE.Group();
    const span= isLeft ? -1 : 1;
    pg.position.set(span*(0.18 + i*1.06), 0, 0);
    const panel=new THREE.Mesh(new THREE.BoxGeometry(1.02,0.035,1.42), panelMat);
    panel.castShadow=false;
    pg.add(panel);
    // cells grid
    for(let cx=-1;cx<=1;cx++){
      for(let cz=-1;cz<=1;cz++){
        if((cx+cz)%2===0) continue;
        const cell=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.038,0.32), cellMat);
        cell.position.set(cx*0.28, 0.008, cz*0.34);
        pg.add(cell);
        // specular line
        const line=new THREE.Mesh(new THREE.BoxGeometry(0.92,0.005,0.02), new THREE.MeshBasicMaterial({color:0x6d9bff, transparent:true, opacity:0.18}));
        line.position.set(0,0.022, cz*0.34);

// --- resize handling for stable 16:9 ---
function onResize(){
  const frame=document.getElementById('frame');
  const vw=window.innerWidth, vh=window.innerHeight;
  const aspect=16/9;
  let w, h;
  if(vw/vh > aspect){ h=vh; w=vh*aspect; } else { w=vw; h=vw/aspect; }
  // renderer size to canvas CSS size * dpr
  const dpr=Math.min(devicePixelRatio,2);
  renderer.setSize(w, h, false);
  // also set canvas style already via CSS but ensure composer size
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  if(useComposer && composer) composer.setSize(w*dpr, h*dpr);
  else renderer.setSize(w, h, false);
}

// --- animation helpers ---
let startTime=performance.now()*0.001;
let lastT=-1;

function computeServiceState(t){
  const startPos=new THREE.Vector3(-26, 2.8, 16);
  const dockPos=new THREE.Vector3(-2.62, 0.06, 0.08);
  let pos=new THREE.Vector3();
  let thrust=0;
  let dockProgress=0;
  if(t < 14){
    const u=clamp(t/14,0,1);
    const e=easeOutCubic(u);
    // subtle approach curve: ease + slight vertical dip then rise
    pos.lerpVectors(startPos, dockPos, e);
    // add braking arc: slight overshoot correction
    pos.y += Math.sin(e*Math.PI)*0.55 * (1-e)*1.2;
    pos.z += Math.sin(e*Math.PI*0.5)*0.6;
    // velocity approx derivative
    const vel = 1 - Math.pow(1-u,1.8);
    // thrust profile: strong early, coast, strong braking
    if(u < 0.18) thrust= 0.95 - u*1.2;
    else if(u < 0.58) thrust= 0.18 + Math.sin(t*3.2)*0.04;
    else if(u < 0.82) thrust= 0.42 + (u-0.58)*1.1;
    else thrust= 0.82 + Math.sin(t*12)*0.18 + (1-u)*0.6; // braking pulses
    thrust=clamp(thrust,0,1);
    dockProgress= clamp((t-10)/4,0,1);
  } else {
    pos.copy(dockPos);
    // stay docked with micro drift locked to satellite
    pos.x += Math.sin(t*0.34)*0.012;
    pos.y += Math.cos(t*0.28)*0.01;
    pos.z += Math.sin(t*0.22)*0.008;
    thrust= 0;
    dockProgress=1;
  }
  return {pos, thrust, dockProgress};
}

function computeRepairState(t){
  // drone phases
  const active = t>=16 && t<23;
  const phase = clamp((t-16)/7,0,1);
  let sub='idle';
  if(phase<0.30) sub='outbound';
  else if(phase<0.45) sub='removing';
  else if(phase<0.70) sub='installing';
  else if(phase<1) sub='return';
  return {active, phase, sub};
}

const scratchV=new THREE.Vector3();
const scratchV2=new THREE.Vector3();

function updateScene(time){
  let raw= time - startTime;
  // force meaningful motion within one second: ensure at t=0 motion already, we already start with motion
  let t= raw % DURATION;
  if(t<0) t+=DURATION;
  // normalize slight smoothing for loop wrap visual: no jump
  const dt = lastT<0? 0 : (t - lastT);
  lastT=t;
  const tN=t/DURATION;

  // Earth & clouds motion
  earthMesh.rotation.y = 0.35 + t*0.012;
  cloudMesh.rotation.y = 0.33 + t*0.018;
  atmoMat.uniforms.time.value=t;
  // tiny earth group breathing?
  // debris drift
  for(const m of debrisMeshes){
    m.position.add(m.userData.drift.clone().multiplyScalar(0.016));
    m.rotation.x += m.userData.spin.x*0.008;
    m.rotation.y += m.userData.spin.y*0.008;
    m.rotation.z += m.userData.spin.z*0.007;
    // wrap
    if(m.position.length()>14){ m.position.multiplyScalar(0.92); }
  }

  // service state
  const svc=computeServiceState(t);
  serviceGroup.position.copy(svc.pos);
  // service orientation: approach attitude, then align to satellite after docking
  let svcRotY=0, svcRotZ=0, svcRotX=0;
  if(t<8){
    svcRotY= lerp(0.35, -0.08, easeOutCubic(clamp(t/8,0,1)));
    svcRotZ= -0.06 + Math.sin(t*0.9)*0.02;
  } else if(t<13){
    const u=clamp((t-8)/5,0,1);
    svcRotY= lerp(-0.08, 0.02, smoothstep(u));
    svcRotZ= lerp(-0.06, 0.01, smoothstep(u));
    svcRotX= lerp(0, -0.03, smoothstep(u));
  } else {
    svcRotY= 0.02;
    svcRotZ= 0.005;
  }
  serviceGroup.rotation.set(svcRotX, svcRotY, svcRotZ);

  // thruster plumes
  for(let i=0;i<plumeMats.length;i++){
    const mesh=plumeMats[i];
    const core=mesh.userData.core;
    const base= svc.thrust * (0.72 + (i===1?0.2:0) + Math.sin(t*18 + i)*0.07 );
    const op= clamp(base,0,1) * 0.92;
    const pulse = (t>12.6 && t<14) ? (Math.sin(t*22+i)*0.5+0.5)*0.35+0.65 : 1;
    mesh.material.opacity= op*pulse;
    core.material.opacity= op*0.55*pulse;
    const scale= 0.55 + base*1.35;
    mesh.scale.set(scale, 1, 1);
    core.scale.set(scale*0.82,1,1);
    mesh.position.x= -0.08 - base*0.07;
    // flicker
    mesh.material.color.setHSL(0.055 + Math.sin(t*9+i)*0.015, 1, 0.58 + base*0.08);
  }

  // service nav lights blink
  svcLights.forEach((l,i)=>{
    const blink= (Math.sin(t*3.2 + i*1.7)>0.15) ? 1:0.12;
    l.material.emissiveIntensity= 1.2 + blink*1.4;
    l.material.opacity= 0.55+blink*0.45;
    const s= 1+blink*0.22;
    l.scale.set(s,s,s);
  });

  // satellite tumble and repair states
  const repairDone = t >= 21.2;
  const dockingLocked = t >= 13.2;
  let tumbleFactor;
  if(t < 13.2) tumbleFactor=1;
  else if(t < 21.2) tumbleFactor= THREE.MathUtils.mapLinear(t,13.2,21.2,1,0);
  else tumbleFactor=0;

  // base tumbling before lock
  if(tumbleFactor>0.001){
    satelliteGroup.rotation.x= Math.sin(t*0.52 + 0.2)*0.28*tumbleFactor + 0.12*(1-tumbleFactor);
    satelliteGroup.rotation.y= Math.cos(t*0.41)*0.46*tumbleFactor + Math.sin(t*0.18)*0.08*tumbleFactor -0.12;
    satelliteGroup.rotation.z= Math.sin(t*0.33)*0.22*tumbleFactor + Math.cos(t*0.61)*0.12*tumbleFactor;
  } else {
    // smoothly settle to stable pose
    const settle= clamp((t-21.2)/1.2,0,1);
    const sx=THREE.MathUtils.lerp(satelliteGroup.rotation.x, 0.04, settle*0.08);
    const sy=THREE.MathUtils.lerp(satelliteGroup.rotation.y, -0.06, settle*0.08);
    const sz=THREE.MathUtils.lerp(satelliteGroup.rotation.z, 0, settle*0.08);
    satelliteGroup.rotation.set(sx,sy,sz);
    // after settle just hold
    if(settle>0.95) satelliteGroup.rotation.set(0.04,-0.06,0.0);
  }
  // subtle orbital bob
  satelliteGroup.position.y= 0.2 + Math.sin(t*0.38)*0.04*(1-tumbleFactor*0.7);

  // solar array deployment
  const deployP= clamp((t-22)/4.8,0,1);
  const deployE= easeInOutCubic(deployP);
  const startAngle=0.62; // folded droopy
  const endAngle=0.0;

  // drone trajectory
  {

  // sparks & warning lights
  {

  // --- camera choreography: 6 shots ---
  let camPos=new THREE.Vector3();

  }

  }

  // subtle camera roll for dynamism (very small)
  camera.rotation.z+= Math.sin(t*0.35)*0.0025;

  // --- loop fade to hide hard reset ---
  // create vignette fade near wrap
  const wrapFade = (()=>{
    if(t<0.45) return smoothstep(t/0.45);
    if(t> DURATION-0.45) return smoothstep((DURATION-t)/0.45);
    return 1;
  })();
  // we modulate exposure / overlay via renderer? Instead adjust scene fog? Simplest adjust overlay opacity via CSS vignette
  document.getElementById('vignette').style.opacity= String( 1 - wrapFade*0.0 ); // keep visible but adjust if needed
  // also add black overlay for seam: use body background? We'll just modulate renderer toneMappingExposure slightly
  renderer.toneMappingExposure= 1.12 * (0.72 + 0.28*wrapFade);

}

function animate(now){
  requestAnimationFrame(animate);
  const sec= now*0.001;
  updateScene(sec);
  if(useComposer && composer) composer.render();
  else renderer.render(scene,camera);
}
requestAnimationFrame(animate);

// ensure meaningful motion within one second: kick startTime to now minus small offset so t starts 0.1
startTime= performance.now()*0.001 - 0.08;

// handle visibility change to keep deterministic loop?
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) startTime= performance.now()*0.001 - ( (performance.now()*0.001 - startTime) % DURATION );
});

</script>
</body>
